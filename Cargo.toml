[package]
name = "reprise"
description = "A second brain for your coding agent: project state, decisions and rules kept as Markdown in a vault you own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/emredagci/reprise"
readme = "README.md"
keywords = ["claude-code", "memory", "agent", "markdown", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "templates/**/*", "README.md", "LICENSE", "NOTICE"]

# `cargo binstall reprise` installs the signed release archive instead of building. The archives name the
# platform, not the Rust target, so each target says where its archive is.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ version }-macos-arm64.tar.gz"
bin-dir = "{ name }-{ version }-macos-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ version }-macos-x86_64.tar.gz"
bin-dir = "{ name }-{ version }-macos-x86_64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ version }-linux-arm64.tar.gz"
bin-dir = "{ name }-{ version }-linux-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ version }-linux-x86_64.tar.gz"
bin-dir = "{ name }-{ version }-linux-x86_64/{ bin }{ binary-ext }"

[[bin]]
name = "reprise"
path = "src/cli/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.178"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "xtask"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
reprise = { path = "." }
anyhow = "1.0.104"
dirs = "7.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
