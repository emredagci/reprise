# reprise vault. Format: docs/vault-format.md in the reprise repository.
format = 3

[projects]
# Folders that hold unrelated sub-projects: `<folder>/<container>/<name>` is project `<name>`.
containers = []

[hooks]
# Context usage percentages at which a handoff is suggested, once each per session.
context_thresholds = [70, 85]

[hooks.context_windows]
# Model name fragment -> context window in tokens. The longest matching fragment wins.
opus = 1000000
sonnet = 1000000
haiku = 200000
default = 200000

[sweep]
# `reprise sweep` distills sessions that ended without a handoff card into records.
# Minutes a transcript must be left unwritten before it is distilled.
settle_minutes = 60
# Most sessions distilled in one run.
max_per_run = 4
# Sessions with fewer messages from the user are skipped.
min_user_turns = 2
